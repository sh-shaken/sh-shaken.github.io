<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width,initial-scale=1" name="viewport">
  <title>結果受け取りページ</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
  <script src="https://unpkg.com/@pdf-lib/fontkit/dist/fontkit.umd.js"></script>
  <style>
* {
  box-sizing: border-box;
}
    body {
      font-family: 'Noto Sans JP', sans-serif;
      background-color: #f0f2f5;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      background-color: #fff;
      padding: 2em;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,.1);
      max-width: 400px;
      width: 90%;
      text-align: center;
    }
    h1 {
      margin-bottom: 1.5em;
      color: #333;
    }
    label {
      display: block;
      text-align: left;
      margin-top: 1em;
      font-weight: 700;
      color: #555;
    }
    input {
      width: 100%;
      padding: .7em;
      margin-top: .3em;
      font-size: 1em;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
    }
    button {
      margin-top: 1.5em;
      padding: .8em 1.5em;
      font-size: 1em;
      background-color: #007bff;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      transition: background-color .3s ease;
    }
    button:hover {
      background-color: #0056b3;
    }
    #status {
      margin-top: 1em;
      color: #333;
      font-size: .9em;
    }
    #status a {
      color: #007bff;
      text-decoration: underline;
    }
    #status a:hover {
      color: #0056b3;
    }
pre {
  text-align: left;
  background: #f7f7f7;
  padding: 1em;
  border-radius: 6px;
  font-size: .85em;
  margin-top: 1em;
  white-space: pre-wrap;      /* 改行を保持しつつ折り返す */
  word-break: break-word;     /* 長い日本語・英数字も折り返す */
  overflow-wrap: anywhere;    /* はみ出し防止 */
  line-height: 1.6;
  max-height: 260px;
  overflow-y: auto;
}
    noscript {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: #ffcccc;
      color: #900;
      font-weight: bold;
      padding: 1em;
      text-align: center;
      z-index: 9999;
    }
  </style>
</head>
<body>
  <noscript>
    【注意】JavaScriptが無効になっています。<br>
    結果を表示・取得するには、ブラウザ設定でJavaScriptを有効にしてください。
  </noscript>

  <div class="container">
    <h1>結果を受け取る！</h1>
    <form onsubmit="handleLogin(event)">
      <label for="number">番号 (1〜4桁の半角数字):</label>
      <input id="number" name="number" pattern="^\d{1,4}$" required title="1〜4桁の半角数字を入力してください">
      <label for="password">パスワード (4桁の半角数字):</label>
      <input id="password" name="password" pattern="^\d{4}$" required title="4桁の半角数字を入力してください">
      <button type="submit">送信</button>
    </form>
    <p id="status"></p>
    <p id="contact-link" style="display:none;margin-top:1em;font-size:.9em">
      お困りですか？<br>
      <a href="https://forms.gle/653SgnhWdSB2ABk58" target="_blank">お問い合わせフォーム</a>からご連絡ください。
    </p>
<p id="pdf-link" style="display:none;margin-top:1em;font-size:.9em">
  ※あなたの結果はすでに下に書かれています。<br>
  結果用紙のテンプレートをご覧になりたい場合は、<br>
  <a id="template-link" href="https://sh-shaken.github.io/one.pdf" target="_blank">こちらをクリック</a>してください。
</p>
  </div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzoD_5iyWmlfHn1CyXvf9O-_3vwBAZ34nze86Z6cV5pPTxjZ9Tugin6zttn2CHkdhCFEQ/exec';

const PDF_TEMPLATE_URLS = {
  one: 'https://sh-shaken.github.io/one.pdf',
  two: 'https://sh-shaken.github.io/two.pdf',
  home: 'https://sh-shaken.github.io/home.pdf'
};

const FONT_URL = 'https://sh-shaken.github.io/fonts/NotoSansJP-Bold.ttf';

function getEl(id) {
  return document.getElementById(id);
}

function showElement(el) {
  el.style.display = 'block';
}

function hideElement(el) {
  el.style.display = 'none';
}

function clearJsonpTimeout() {
  if (window.jsonpTimeoutId) {
    clearTimeout(window.jsonpTimeoutId);
    window.jsonpTimeoutId = null;
  }
}

function removeJsonpScript() {
  const existing = getEl('jsonpScript');
  if (existing) existing.remove();
}

function getPdfType(userData) {
  return String(userData['受取'] || '').trim();
}

function escapeHtml(str) {
  return String(str)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function handleLogin(event) {
  event.preventDefault();

  const status = getEl('status');
  const contact = getEl('contact-link');
  const pdfLink = getEl('pdf-link');

  if (!navigator.onLine) {
    status.textContent = "ネットワークに接続されていません。Wi-Fiや通信状況を確認してください。";
    showElement(contact);
    showElement(pdfLink);
    return;
  }

  const number = getEl('number').value.trim().replace(/^0+/, '');
  const password = getEl('password').value.trim();

  status.textContent = "番号とパスワードを照合しています...";
  hideElement(contact);
  hideElement(pdfLink);

  removeJsonpScript();
  clearJsonpTimeout();

  const script = document.createElement('script');
  script.id = 'jsonpScript';
  script.src = `${GAS_URL}?action=pdfmaker&id=${encodeURIComponent(number)}&pw=${encodeURIComponent(password)}&callback=handleJSONPResponse`;

  window.jsonpTimeoutId = setTimeout(() => {
    removeJsonpScript();
    status.textContent = "データベースからの応答がありませんでした。通信状況を確認して、もう一度お試しください。";
    showElement(contact);
    showElement(pdfLink);
  }, 30000);

  script.onerror = () => {
    clearJsonpTimeout();
    status.textContent = "サーバーに接続できませんでした。時間をおいて再試行してください。";
    showElement(contact);
    showElement(pdfLink);
  };

  document.body.appendChild(script);
}

async function handleJSONPResponse(result) {
  clearJsonpTimeout();
  removeJsonpScript();

  const status = getEl('status');
  const contact = getEl('contact-link');
  const pdfLink = getEl('pdf-link');

  status.textContent = "PDFを生成しています...";

if (!result.success) {
  status.textContent = result.message || "番号またはパスワードが一致しません。";
  showElement(contact);
  hideElement(pdfLink);
  return;
}
  updateTemplateLink(result);
  showResultLog(result);

  try {
    await generatePDF(result);

const noticeHtml = result.message
  ? `<div style="margin-bottom:1em;color:#b35c00;font-weight:bold;">${escapeHtml(result.message)}</div>`
  : "";

status.innerHTML = `
  ${noticeHtml}
  結果の生成が完了しました！心理テストにご協力いただき、ありがとうございました！<br><br>
  <small style="font-size: 0.85em; color: #555;">
    ※標準ブラウザ以外からアクセスしている場合、PDFが自動でダウンロードされないことがあります。<br>
    <a href="https://sh-shaken.github.io/errorpdf.html" target="_blank" style="font-size: 0.8em; color: #007bff; text-decoration: underline;">
      PDFがダウンロードされない場合はこちらをタップ
    </a>
  </small>
`;

  } catch (err) {
    console.error("PDF生成エラー:", err);
    status.textContent = "PDF生成エラー: " + err.message;
    showElement(contact);
    showElement(pdfLink);
  }
}

function updateTemplateLink(result) {
  const pdfType = getPdfType(result);
  const templateLink = getEl('template-link');

  if (templateLink && PDF_TEMPLATE_URLS[pdfType]) {
    templateLink.href = PDF_TEMPLATE_URLS[pdfType];
  }
}

function showResultLog(result) {
  const oldPre = getEl('result-log');
  if (oldPre) oldPre.remove();

  const pdfType = getPdfType(result);
  const templateUrl = PDF_TEMPLATE_URLS[pdfType] || '#';

  const logLines = Object.entries(result)
    .filter(([key]) => key !== "success")
    .map(([key, val]) => {
      if (pdfType === "one" && (key === "TYPE" || key === "説明")) {
        return `${key}: XXXX(2回目の心理テストをやった後に解禁されます)`;
      }

      return `${key}: ${val}`;
    })
    .join("\n");

  const pre = document.createElement('pre');
  pre.id = 'result-log';
  pre.innerHTML =
    escapeHtml("【取得データログ】\n" + logLines + "\n\n") +
    `<a href="${templateUrl}" target="_blank" style="color:#007bff;text-decoration:underline;">使用テンプレートはこちら</a>`;

  document.querySelector('.container').appendChild(pre);
}

async function generatePDF(userData) {
  const pdfType = getPdfType(userData);
  const templateUrl = PDF_TEMPLATE_URLS[pdfType];

  if (!templateUrl) {
    throw new Error("対応するPDFテンプレートが見つかりません: " + pdfType);
  }

  const [pdfBytes, fontBytes] = await Promise.all([
    fetchArrayBuffer(templateUrl, "PDFテンプレートを取得できませんでした。"),
    fetchArrayBuffer(FONT_URL, "フォントを取得できませんでした。")
  ]);

  const pdfDoc = await PDFLib.PDFDocument.load(pdfBytes);
  pdfDoc.registerFontkit(window.fontkit);

  const customFont = await pdfDoc.embedFont(fontBytes);
  const pages = pdfDoc.getPages();

if (pdfType === "one") {
  writeOnePdf(pages, customFont, userData);
} else if (pdfType === "two") {
  writeTwoPdf(pages, customFont, userData);
} else if (pdfType === "home") {
  writeHomePdf(pages, customFont, userData);
}

  const pdfBytesOut = await pdfDoc.save();
  const blob = new Blob([pdfBytesOut], { type: 'application/pdf' });
  const url = URL.createObjectURL(blob);

  downloadPDF(url, createPdfFileName(userData));

  return url;
}

async function fetchArrayBuffer(url, errorMessage) {
  const response = await fetch(url);

  if (!response.ok) {
    throw new Error(errorMessage);
  }

  return response.arrayBuffer();
}

function downloadPDF(url, fileName) {
  try {
    const a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    a.remove();
  } catch {}
}

function writeOnePdf(pages, customFont, userData) {
  const red = PDFLib.rgb(1, 0, 0);

  const positionsPage1 = {
    ID: { x: 276, y: 577.8, size: 40 }
  };

  const positionsPage3 = {
    ID:   { x: 492, y: 772, size: 12 },
    左脳: { x: 200, y: 648, size: 40 },
    右脳: { x: 350, y: 648, size: 40 }
  };

  const positionsPage4 = {
    CP: { x: 90.5, y: 521, size: 18 },
    NP: { x: 90.5, y: 476, size: 18 },
    A:  { x: 90.5, y: 434, size: 18 },
    FC: { x: 90.5, y: 393, size: 18 },
    AC: { x: 90.5, y: 351, size: 18 }
  };

  if (pages[0]) {
    drawPdfText(pages[0], String(userData.ID || ""), {
      ...positionsPage1.ID,
      font: customFont,
      color: red
    });
  }

  if (pages[2]) {
    const page3 = pages[2];

    for (const key in positionsPage3) {
      drawUserDataText(page3, customFont, red, userData, key, positionsPage3[key]);
    }

    drawStudentOval(page3, String(userData.学生 || "").trim(), red);
  }

  if (pages[3]) {
    const page4 = pages[3];

    for (const key in positionsPage4) {
      drawUserDataText(page4, customFont, red, userData, key, positionsPage4[key]);
    }
  }
}

function writeTwoPdf(pages, customFont, userData) {
  // two.pdf は home.pdf の内容に加えて、
  // 2ページ目にも第1回受験の番号を書き込む
  writeHomePdf(pages, customFont, userData);

  const red = PDFLib.rgb(1, 0, 0);

  // 2ページ目：第1回受験認定書
  // 書き込み位置は現時点では1ページ目と同じ
  const positionsPage2 = {
    ID: { x: 276, y: 577.8, size: 40 }
  };

  if (pages[1]) {
    drawPdfText(pages[1], String(userData.ID || ""), {
      ...positionsPage2.ID,
      font: customFont,
      color: red
    });
  }
}

function writeHomePdf(pages, customFont, userData) {
  // home.pdf は one.pdf とほぼ同じ
  // 1ページ目・3ページ目・4ページ目は one と同じ処理
  writeOnePdf(pages, customFont, userData);

  const red = PDFLib.rgb(1, 0, 0);

  // 5ページ目：社研タイプ診断
  // pages[4] = 5ページ目
  if (!pages[4]) return;

  const page5 = pages[4];

drawCenteredWrappedPdfText(page5, String(userData.TYPE || ""), {
  centerX: page5.getWidth() / 2,
  y: 197,
  size: 35,
  maxWidth: 470,
  lineHeight: 30,
  font: customFont,
  color: red
});

  drawWrappedPdfText(page5, String(userData.説明 || ""), {
    x: 80,
    y: 122,
    size: 10,
    maxWidth: 450,
    lineHeight: 18,
    font: customFont,
    color: red
  });
}

function drawUserDataText(page, font, color, userData, key, position) {
  const val = userData[key];

  if (val === undefined || val === null || val === "") return;

  drawPdfText(page, String(val), {
    ...position,
    font,
    color
  });
}

function drawStudentOval(page, student, color) {
  const studentOvalMap = {
    "小学生": { x: 84, y: 245, xScale: 26, yScale: 13 },
    "中学生": { x: 84, y: 205, xScale: 26, yScale: 13 },
    "高校生": { x: 84, y: 164, xScale: 26, yScale: 13 },
    "大学生": { x: 84, y: 124, xScale: 26, yScale: 13 },
    "教授":   { x: 84, y:  84, xScale: 26, yScale: 13 }
  };

  const pos = studentOvalMap[student];
  if (!pos) return;

  page.drawEllipse({
    x: pos.x,
    y: pos.y,
    xScale: pos.xScale,
    yScale: pos.yScale,
    borderColor: color,
    borderWidth: 2
  });
}

function drawPdfText(page, text, options) {
  page.drawText(text, {
    x: options.x,
    y: options.y,
    size: options.size,
    font: options.font,
    color: options.color
  });
}

function drawWrappedPdfText(page, text, options) {
  const {
    x,
    y,
    size,
    maxWidth,
    lineHeight,
    font,
    color
  } = options;

  const lines = splitTextByWidth(String(text), font, size, maxWidth);

  lines.forEach((line, index) => {
    page.drawText(line, {
      x,
      y: y - index * lineHeight,
      size,
      font,
      color
    });
  });
}

function drawCenteredWrappedPdfText(page, text, options) {
  const {
    centerX,
    y,
    size,
    maxWidth,
    lineHeight,
    font,
    color
  } = options;

  const lines = splitTextByWidth(String(text), font, size, maxWidth);

  lines.forEach((line, index) => {
    const lineWidth = font.widthOfTextAtSize(line, size);

    page.drawText(line, {
      x: centerX - lineWidth / 2,
      y: y - index * lineHeight,
      size,
      font,
      color
    });
  });
}

function splitTextByWidth(text, font, size, maxWidth) {
  const lines = [];
  let currentLine = "";

  for (const char of text) {
    const testLine = currentLine + char;
    const width = font.widthOfTextAtSize(testLine, size);

    if (width > maxWidth && currentLine !== "") {
      lines.push(currentLine);
      currentLine = char;
    } else {
      currentLine = testLine;
    }
  }

  if (currentLine) {
    lines.push(currentLine);
  }

  return lines;
}

function createPdfFileName(userData) {
  const id = String(userData['ID'] || 'output').trim();
  const pdfType = getPdfType(userData);

  let typeLabel = pdfType;

  if (pdfType === 'one') {
    typeLabel = 'Lv1';
  } else if (pdfType === 'two') {
    typeLabel = 'LvMAX';
  } else if (pdfType === 'home') {
    typeLabel = 'home';
  }

  return `社研心理テスト2026_${id}_${typeLabel}.pdf`;
}
</script>
</body>
</html>
