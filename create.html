<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>番号を発行</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
body {
  font-family: 'Noto Sans JP', sans-serif;
  background-color: #f8f9fa;
  margin: 0;
  padding: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}
.container {
  background-color: #fff;
  padding: 2em;
  border-radius: 12px;
  box-shadow: 0 4px 16px rgba(0,0,0,.1);
  text-align: center;
  max-width: 400px;
  width: 90%;
}
h1 { margin-bottom: 1em; color: #333; }
.label { font-size: 1em; color: #555; margin-top: 1em; }
.code { font-size: 2em; margin: .5em 0 1.2em 0; font-weight: 700; color: #007bff; }
.note { font-size: .9em; color: #777; }
button {
  margin-top: 1em;
  padding: .8em 1.5em;
  font-size: 1em;
  color: #fff;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  transition: background-color .3s ease;
  width: 100%;
}
.number-row {
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  margin: .5em 0 1.2em 0;
  min-height: 3em;
}

.number-row .code {
  margin: 0;
  text-align: center;
}

.reissue-button {
  position: absolute;
  left: calc(50% + 70px); /* ← 再発行ボタンの右位置。微調整はここ */
  top: 50%;
  transform: translateY(-50%);
  width: auto;
  margin-top: 0;
  padding: .4em .65em;
  font-size: .7em;
  background-color: #6c757d;
  white-space: nowrap;
}

.reissue-button:hover {
  background-color: #5a6268;
}

.reissue-button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

/* コピーボタン（青） */
.copy-button {
  background-color: rgba(0,123,255,.5); /* 初期は薄青 */
}
.copy-button.loaded {
  background-color: #007bff; /* 番号取得後は明るい青 */
}
.copy-button:hover {
  background-color: rgba(0,86,179,1);
}

/* 心理テストボタン（紫） */
.test-button {
  background-color: rgba(111,66,193,0.5); /* 初期は薄紫 */
}
.test-button.clicked {
  background-color: #6f42c1; /* コピー後は濃い紫 */
}
.test-button:hover {
  background-color: #5a32a3;
}
</style>
</head>
<body>
<div class="container">
  <h1 id="status-message">あなたの番号を発行しています...</h1>
  <div class="label">番号:</div>
<div class="number-row">
  <div class="code" id="number">読み込み中...</div>
  <button class="reissue-button" id="reissueButton" type="button">再発行</button>
</div>
  <button class="copy-button" id="copyButton">少し待てば、番号をコピーできます...</button>
  <p class="note">二回目の人は番号を発行せずに、このまま心理テストをお受けください。</p>
  <p class="note">この番号は必ずコピーし、画面のスクリーンショットを撮影してださい。<br>作業が完了しましたら、次へお進みください。↓</p>
  <button class="test-button" id="testButton">心理テストを受ける！</button>
</div>

<script>
const LIMIT_MINUTES = 10;
const MAX_ISSUE_COUNT = 5;

const STORAGE_KEY_NUMBER = "issuedNumber";
const STORAGE_KEY_ISSUE_LOG = "numberIssueLog";

function getIssueLog() {
  const raw = localStorage.getItem(STORAGE_KEY_ISSUE_LOG);
  if (!raw) return [];

  try {
    return JSON.parse(raw);
  } catch (e) {
    return [];
  }
}

function saveIssueLog(log) {
  localStorage.setItem(STORAGE_KEY_ISSUE_LOG, JSON.stringify(log));
}

function checkIssueLimit() {
  const now = Date.now();
  const limitTime = LIMIT_MINUTES * 60 * 1000;

  let log = getIssueLog();

  // 10分以内の発行履歴だけ残す
  log = log.filter(time => now - time <= limitTime);

  return {
    log,
    count: log.length,
    canIssue: log.length < MAX_ISSUE_COUNT
  };
}

function recordIssue(log) {
  log.push(Date.now());
  saveIssueLog(log);
}

function issueNumber() {
  const gasUrl = "https://script.google.com/macros/s/AKfycbzoD_5iyWmlfHn1CyXvf9O-_3vwBAZ34nze86Z6cV5pPTxjZ9Tugin6zttn2CHkdhCFEQ/exec";

  return new Promise((resolve, reject) => {
    const callbackName = "gasCallback_" + Date.now() + "_" + Math.floor(Math.random() * 100000);

    let finished = false;

    const script = document.createElement("script");
    script.id = "issueJsonpScript";

    const timeoutId = setTimeout(() => {
      if (finished) return;

      finished = true;
      delete window[callbackName];

      if (script.parentNode) {
        script.remove();
      }

      reject(new Error("番号発行サーバーから応答がありませんでした。通信環境を確認してください。"));
    }, 15000);

    window[callbackName] = function(data) {
      if (finished) return;

      finished = true;
      clearTimeout(timeoutId);
      delete window[callbackName];

      if (script.parentNode) {
        script.remove();
      }

      if (data && data.success) {
        resolve(data.number);
      } else {
        reject(new Error(data.message || "番号の発行に失敗しました。"));
      }
    };

    script.onerror = function() {
      if (finished) return;

      finished = true;
      clearTimeout(timeoutId);
      delete window[callbackName];

      if (script.parentNode) {
        script.remove();
      }

      reject(new Error("GASとの通信に失敗しました。標準ブラウザで開き直してください。現在、このバグについて詳しい内容を調査中です。直らなければ、お問い合わせをしてくれると、こちら側も大変助かります。"));
    };

    script.src =
      gasUrl +
      "?action=issueNumber" +
      "&callback=" + encodeURIComponent(callbackName) +
      "&t=" + Date.now(); // キャッシュ対策

    document.body.appendChild(script);
  });
}

function setupCopyButton(number, copyButton, testButton, text = "番号をコピーする") {
  copyButton.disabled = false;
  copyButton.classList.add('loaded');
  copyButton.textContent = text;

  copyButton.onclick = function() {
    navigator.clipboard.writeText(number)
      .then(() => {
        alert("番号をコピーしました: " + number);
        testButton.classList.add('clicked'); // 紫ボタンを濃く
        copyButton.classList.remove('loaded'); // 色を薄青に戻す
      })
      .catch(() => {
        alert("コピーに失敗しました。番号をスクリーンショットしてください。");
      });
  };
}

(async () => {
  const numberDisplay = document.getElementById('number');
  const statusMessage = document.getElementById('status-message');
  const copyButton = document.getElementById('copyButton');
  const testButton = document.getElementById('testButton');
  const reissueButton = document.getElementById('reissueButton');

  testButton.onclick = function() {
    window.open("https://forms.gle/NFEDqTieeTp4V2qK7", "_blank");
  };

  async function requestNewNumber(isReissue = false) {
    const limitResult = checkIssueLimit();
    const savedNumber = localStorage.getItem(STORAGE_KEY_NUMBER);

    if (!limitResult.canIssue) {
      if (savedNumber) {
        numberDisplay.textContent = savedNumber;
        statusMessage.textContent = "更新しすぎています。新しい番号を発行することができません。最後に発行した番号を表示しています。";
        setupCopyButton(savedNumber, copyButton, testButton, "最後の番号をコピーする");
      } else {
        numberDisplay.textContent = "番号がありません";
        statusMessage.textContent = "更新しすぎています。新しい番号を発行することができません。";
        copyButton.textContent = "番号をコピーできません";
        copyButton.disabled = true;
      }

      return;
    }

    try {
      reissueButton.disabled = true;
      copyButton.disabled = true;

      statusMessage.textContent = isReissue
        ? "新しい番号を再発行しています..."
        : "あなたの番号を発行しています...";

      numberDisplay.textContent = "読み込み中...";

      const number = await issueNumber();

      localStorage.setItem(STORAGE_KEY_NUMBER, number);
      recordIssue(limitResult.log);

      numberDisplay.textContent = number;
      statusMessage.textContent = isReissue
        ? "新しい番号が再発行されました！"
        : "あなたの番号が発行されました！";

      setupCopyButton(number, copyButton, testButton);

    } catch (e) {
      console.error(e);

      const savedNumber = localStorage.getItem(STORAGE_KEY_NUMBER);

      if (savedNumber) {
        numberDisplay.textContent = savedNumber;
        statusMessage.textContent = "新しい番号の発行に失敗しました。前回の番号を表示しています。";
        setupCopyButton(savedNumber, copyButton, testButton, "前回の番号をコピーする");
      } else {
        numberDisplay.textContent = "番号が取得できませんでした";
        statusMessage.textContent = e.message || "番号の発行に失敗しました";
        copyButton.textContent = "番号をコピーできません";
        copyButton.disabled = true;
      }

    } finally {
      reissueButton.disabled = false;
    }
  }

  reissueButton.onclick = function() {
    const ok = confirm("新しい番号を再発行しますか？\n現在表示されている番号とは別の番号が発行されます。");

    if (ok) {
      requestNewNumber(true);
    }
  };

  const savedNumber = localStorage.getItem(STORAGE_KEY_NUMBER);

  if (savedNumber) {
    numberDisplay.textContent = savedNumber;
    statusMessage.textContent = "前回発行した番号を表示しています。新しい番号が必要な場合は「再発行」を押してください。";
    setupCopyButton(savedNumber, copyButton, testButton);
  } else {
    await requestNewNumber(false);
  }
})();
</script>
</body>
</html>
