<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>番号を発行</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
body {
  font-family: 'Noto Sans JP', sans-serif;
  background-color: #f8f9fa;
  margin: 0;
  padding: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}
.container {
  background-color: #fff;
  padding: 2em;
  border-radius: 12px;
  box-shadow: 0 4px 16px rgba(0,0,0,.1);
  text-align: center;
  max-width: 400px;
  width: 90%;
}
h1 { margin-bottom: 1em; color: #333; }
.label { font-size: 1em; color: #555; margin-top: 1em; }
.code { font-size: 2em; margin: .5em 0 1.2em 0; font-weight: 700; color: #007bff; }
.note { font-size: .9em; color: #777; }
button {
  margin-top: 1em;
  padding: .8em 1.5em;
  font-size: 1em;
  color: #fff;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  transition: background-color .3s ease;
  width: 100%;
}

/* コピーボタン（青） */
.copy-button {
  background-color: rgba(0,123,255,.5); /* 初期は薄青 */
}
.copy-button.loaded {
  background-color: #007bff; /* 番号取得後は明るい青 */
}
.copy-button:hover {
  background-color: rgba(0,86,179,1);
}

/* 心理テストボタン（紫） */
.test-button {
  background-color: rgba(111,66,193,0.5); /* 初期は薄紫 */
}
.test-button.clicked {
  background-color: #6f42c1; /* コピー後は濃い紫 */
}
.test-button:hover {
  background-color: #5a32a3;
}
</style>
</head>
<body>
<div class="container">
  <h1 id="status-message">あなたの番号を発行しています...</h1>
  <div class="label">番号:</div>
  <div class="code" id="number">読み込み中...</div>
  <button class="copy-button" id="copyButton">少し待てば、番号をコピーできます...</button>
  <p class="note">※受付より番号札が既に配られている場合、この番号は必要ありません。</p>
  <p class="note">※この番号はコピー、または画面をスクリーンショットしてください。コピーまたはスクリーンショットしたら次に進んでください。↓</p>
  <button class="test-button" id="testButton">心理テストを受ける！</button>
</div>

<script>
const LIMIT_MINUTES = 10;
const MAX_ISSUE_COUNT = 5;

const STORAGE_KEY_NUMBER = "issuedNumber";
const STORAGE_KEY_ISSUE_LOG = "numberIssueLog";

function getIssueLog() {
  const raw = localStorage.getItem(STORAGE_KEY_ISSUE_LOG);
  if (!raw) return [];

  try {
    return JSON.parse(raw);
  } catch (e) {
    return [];
  }
}

function saveIssueLog(log) {
  localStorage.setItem(STORAGE_KEY_ISSUE_LOG, JSON.stringify(log));
}

function checkIssueLimit() {
  const now = Date.now();
  const limitTime = LIMIT_MINUTES * 60 * 1000;

  let log = getIssueLog();

  // 10分以内の発行履歴だけ残す
  log = log.filter(time => now - time <= limitTime);

  return {
    log,
    count: log.length,
    canIssue: log.length < MAX_ISSUE_COUNT
  };
}

function recordIssue(log) {
  log.push(Date.now());
  saveIssueLog(log);
}

function issueNumber() {
  const gasUrl = "https://script.google.com/macros/s/AKfycbzoD_5iyWmlfHn1CyXvf9O-_3vwBAZ34nze86Z6cV5pPTxjZ9Tugin6zttn2CHkdhCFEQ/exec";

  return new Promise((resolve, reject) => {
    const callbackName = "gasCallback_" + Date.now();

    window[callbackName] = function(data) {
      delete window[callbackName];
      script.remove();

      if (data && data.success) {
        resolve(data.number);
      } else {
        reject(new Error(data.message || "番号の発行に失敗しました。"));
      }
    };

    const script = document.createElement("script");
    script.src = gasUrl + "?action=issueNumber&callback=" + callbackName;
    script.onerror = function() {
      delete window[callbackName];
      script.remove();
      reject(new Error("GASとの通信に失敗しました。"));
    };

    document.body.appendChild(script);
  });
}

function setupCopyButton(number, copyButton, testButton, text = "番号をコピーする") {
  copyButton.disabled = false;
  copyButton.classList.add('loaded');
  copyButton.textContent = text;

  copyButton.onclick = function() {
    navigator.clipboard.writeText(number)
      .then(() => {
        alert("番号をコピーしました: " + number);
        testButton.classList.add('clicked'); // 紫ボタンを濃く
        copyButton.classList.remove('loaded'); // 色を薄青に戻す
      })
      .catch(() => {
        alert("コピーに失敗しました。番号をスクリーンショットしてください。");
      });
  };
}

(async () => {
  const numberDisplay = document.getElementById('number');
  const statusMessage = document.getElementById('status-message');
  const copyButton = document.getElementById('copyButton');
  const testButton = document.getElementById('testButton');

  testButton.onclick = function() {
    window.open("https://forms.gle/NFEDqTieeTp4V2qK7", "_blank"); // 変更可能
  };

  const limitResult = checkIssueLimit();
  const savedNumber = localStorage.getItem(STORAGE_KEY_NUMBER);

  // 10分以内に5回以上発行済みの場合
  if (!limitResult.canIssue) {
    if (savedNumber) {
      numberDisplay.textContent = savedNumber;
      statusMessage.textContent = "更新しすぎています。新しい番号を発行することができません。。";
      setupCopyButton(savedNumber, copyButton, testButton, "最後の番号をコピーする");
    } else {
      numberDisplay.textContent = "番号がありません";
      statusMessage.textContent = "更新しすぎています。新しい番号を発行することができません。";
      copyButton.textContent = "番号をコピーできません";
      copyButton.disabled = true;
    }

    return;
  }

  // 発行可能な場合は新しい番号を発行
  const number = await issueNumber();

  if (!number) {
    if (savedNumber) {
      numberDisplay.textContent = savedNumber;
      statusMessage.textContent = "新しい番号の発行に失敗しました。前回の番号を表示しています";
      setupCopyButton(savedNumber, copyButton, testButton, "前回の番号をコピーする");
    } else {
      numberDisplay.textContent = "番号が取得できませんでした";
      statusMessage.textContent = "番号の発行に失敗しました";
      copyButton.textContent = "番号をコピーできません";
      copyButton.disabled = true;
    }

    return;
  }

  // 発行成功したら、番号と発行履歴を保存
  localStorage.setItem(STORAGE_KEY_NUMBER, number);
  recordIssue(limitResult.log);

  numberDisplay.textContent = number;
  statusMessage.textContent = "あなたの番号が発行されました！";

  setupCopyButton(number, copyButton, testButton);
})();
</script>
</body>
</html>
